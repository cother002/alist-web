name: build

on:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    name: Build
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          registry-url: "https://registry.npmjs.org"

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        id: pnpm-install
        with:
          version: 9

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          repository: cother002/alist-web
          path: alist-web
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Checkout dist repo
        uses: actions/checkout@v4
        with:
          repository: cother002/web-dist
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}
          path: web-dist
          persist-credentials: false
          fetch-depth: 0

      - name: Build
        run: |
          cd alist-web
          pnpm config set registry https://registry.npmmirror.com
          pnpm install
          # pnpm i18n:build
          pnpm build
          cd ..
        # env:
        #   CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
        #   CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Commit dist
        run: |
          cd web-dist
          rm -rf dist
          cp -r ../alist-web/dist .
          git add .
          git config --local user.email "cother.002@gmx.com"
          git config --local user.name "cother002"
          git commit --amend -m "upload dev dist"
          cd ..

      # - name: Upload dist files
